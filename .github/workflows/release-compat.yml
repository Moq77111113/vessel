name: Release compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build vessel
        run: go build -o vessel ./cmd/vessel

      - name: Write a minimal descriptor
        run: |
          mkdir -p /tmp/compat
          cat > /tmp/compat/app.container <<'EOF'
          [Container]
          Image=docker.io/library/busybox:latest
          EOF

      - name: Build a signed release
        run: ./vessel build -o /tmp/myapp --layout /tmp/bundle --name compat --version 0.0.1 /tmp/compat

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify the executable with cosign
        run: |
          cosign verify-blob /tmp/myapp \
            --bundle /tmp/myapp.sigstore \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-compat.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify the layout with cosign
        run: |
          cosign verify-blob /tmp/bundle/index.json \
            --bundle /tmp/bundle/index.json.sigstore \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-compat.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
